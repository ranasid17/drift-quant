name: Offline foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bootstrap locked dependencies (network allowed)
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - name: Install project without network resolution
        env:
          PIP_NO_INDEX: '1'
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Offline tests of installed package
        run: python scripts/check_offline.py
